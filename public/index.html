<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF4E8">
  <title>云养宠物</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>☁️ 云养宠物</h1>
      <div class="top-actions">
        <button id="styleBtn" class="chip" hidden>🎨 写实</button>
        <button id="soundBtn" class="chip" aria-label="切换声音">🔊</button>
        <button id="accountBtn" class="chip" hidden>登录同步</button>
      </div>
    </header>

    <!-- 领养 -->
    <section id="adoptView" hidden>
      <div class="card adopt">
        <h2>领养一只小可爱</h2>
        <p class="muted">它会住在云端。你不在的时候,它也会饿、会困、会想你。</p>
        <div id="styleTabs" class="tabs style-tabs">
          <button data-style="cute" class="active">Q 版萌宠</button>
          <button data-style="real">写实萌宠</button>
        </div>
        <div id="speciesGrid" class="species-grid"></div>
        <input id="petName" maxlength="10" placeholder="给它起个名字吧" autocomplete="off" aria-label="宠物名字">
        <button id="adoptBtn" class="btn primary">领养它 🥚</button>
      </div>
    </section>

    <!-- 宠物的家 -->
    <section id="gameView" hidden>
      <div class="card hud">
        <div class="hud-row">
          <div class="hud-name">
            <strong id="hudName"></strong>
            <span id="hudStage" class="tag"></span>
            <span id="hudAge" class="muted small"></span>
          </div>
          <div class="coins" title="金币"><i class="coin-ico"></i><span id="coins">0</span></div>
        </div>
        <div id="xpWrap" class="xp">
          <div class="xp-bar"><i id="xpBar"></i></div>
          <span id="xpText" class="small muted"></span>
        </div>
      </div>

      <div id="scene" class="scene">
        <div class="window"><div class="sky">
          <span class="sun"></span><span class="moon"></span>
          <span class="cloud c1"></span><span class="cloud c2"></span>
          <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
        </div></div>
        <div class="garland"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="plant">🪴</div>
        <div class="rug"></div>
        <div id="petWrap" class="pet-wrap">
          <div id="bubble" class="bubble"></div>
          <div class="shadow"></div>
          <div id="petMotion" class="pet-motion"><div id="petScale" class="pet-scale"></div></div>
        </div>
        <div id="ball" class="ball" hidden></div>
        <div id="sponge" class="sponge" hidden>🧽</div>
        <div id="fx" class="fx"></div>
      </div>

      <div id="modeBar" class="mode-bar" hidden>
        <span id="modeText"></span>
        <button id="modeDone" class="btn small">完成</button>
      </div>
      <p id="hint" class="hint"></p>

      <div class="card stats">
        <div class="stat"><span>🍙 饱食</span><div class="bar"><i id="bar-hunger"></i></div></div>
        <div class="stat"><span>💗 心情</span><div class="bar"><i id="bar-happy"></i></div></div>
        <div class="stat"><span>🫧 清洁</span><div class="bar"><i id="bar-clean"></i></div></div>
        <div class="stat"><span>⚡ 精力</span><div class="bar"><i id="bar-energy"></i></div></div>
      </div>

      <nav class="actions">
        <button data-act="feed"><span>🍙</span>喂食</button>
        <button data-act="play"><span>⚽</span>玩耍</button>
        <button data-act="bath"><span>🛁</span>洗澡</button>
        <button data-act="sleep"><span id="sleepIcon">🌙</span><em id="sleepLabel">睡觉</em></button>
        <button data-act="shop"><span>🛍️</span>商店</button>
      </nav>

      <div id="panel-feed" class="card panel" hidden>
        <div class="panel-head"><b>喂点什么?</b><span class="muted small">拖到它嘴边,或者点一下</span></div>
        <div id="foodList" class="food-list"></div>
      </div>

      <div id="panel-play" class="card panel" hidden>
        <div class="play-grid">
          <button id="playBall" class="big-choice"><span>⚽</span><b>扔小球</b><small>心情 +10</small></button>
          <button id="playGame" class="big-choice"><span>🍪</span><b>接零食</b><small>赚金币</small></button>
        </div>
      </div>

      <div id="panel-shop" class="card panel" hidden>
        <div class="tabs">
          <button data-tab="food" class="active">食物</button>
          <button data-tab="item">装扮</button>
        </div>
        <div id="shopList" class="shop-list"></div>
      </div>

      <button id="releaseBtn" class="link">重新领养</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <!-- 接零食小游戏 -->
  <div id="gameOverlay" class="overlay" hidden>
    <div class="mg card">
      <div class="mg-hud">
        <span>得分 <b id="mgScore">0</b></span>
        <span id="mgLives"></span>
        <span>⏱ <b id="mgTime">40</b></span>
      </div>
      <div id="mgField" class="mg-field"><div id="mgPet" class="mg-pet"></div></div>
      <p class="small muted center">左右移动接住零食,小心西兰花 🥦</p>
      <div id="mgEnd" class="mg-end" hidden>
        <h3>游戏结束!</h3>
        <p>获得 <b id="mgCoins">0</b> 金币</p>
        <button id="mgClose" class="btn primary">收下</button>
      </div>
    </div>
  </div>

  <!-- 登录 -->
  <dialog id="authDialog" class="card">
    <form id="authForm">
      <h3>登录 / 注册</h3>
      <p class="muted small">登录后宠物保存在云端,换个设备也能见到它。</p>
      <input name="username" placeholder="用户名(2–16 位)" autocomplete="username" required>
      <input name="password" type="password" placeholder="密码(至少 6 位)" autocomplete="current-password" required>
      <p id="authError" class="error"></p>
      <div class="row">
        <button value="login" class="btn primary">登录</button>
        <button value="register" class="btn">注册</button>
      </div>
      <button value="cancel" type="button" id="authCancel" class="link">先不了</button>
    </form>
  </dialog>

  <script src="js/game.js"></script>
  <script src="js/pet-svg.js"></script>
  <script src="js/pet-real.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/minigame.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
