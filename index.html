<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云养宠物</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>☁️ 云养宠物</h1>
      <p class="sub">离开页面后,宠物也会继续长大</p>
    </header>

    <!-- 领养界面 -->
    <section id="adopt" class="card hidden">
      <h2>领养一只宠物</h2>
      <div class="species" id="species"></div>
      <input id="petName" maxlength="12" placeholder="给它起个名字">
      <button id="adoptBtn" class="primary">领养</button>
    </section>

    <!-- 宠物主界面 -->
    <section id="home" class="card hidden">
      <div class="pet-head">
        <h2 id="nameLabel"></h2>
        <span id="ageLabel" class="age"></span>
      </div>
      <div id="pet" class="pet"></div>
      <p id="mood" class="mood"></p>

      <div class="stats">
        <div class="stat"><span>🍖 饱食</span><div class="bar"><i id="bar-hunger"></i></div></div>
        <div class="stat"><span>😊 心情</span><div class="bar"><i id="bar-happy"></i></div></div>
        <div class="stat"><span>🛁 清洁</span><div class="bar"><i id="bar-clean"></i></div></div>
        <div class="stat"><span>⚡ 精力</span><div class="bar"><i id="bar-energy"></i></div></div>
      </div>

      <div class="actions">
        <button data-act="feed">喂食</button>
        <button data-act="play">玩耍</button>
        <button data-act="bath">洗澡</button>
        <button data-act="sleep">睡觉</button>
      </div>

      <button id="releaseBtn" class="link">放生,重新领养</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
